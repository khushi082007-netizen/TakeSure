services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: takesure
      POSTGRES_PASSWORD: takesure
      POSTGRES_DB: takesure
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takesure"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env        # optional: GROQ_API_KEY / TINYFISH_API_KEY
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://takesure:takesure@db:5432/takesure
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
